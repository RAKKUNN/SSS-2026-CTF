services:
  # [소프트웨어및시스템보안] 주차별 개별 실습 컨테이너 (04_fsb)
  ctf-fsb:
    build:
      context: ./04_fsb
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      - STUDENT_ID=${STUDENT_ID:-default}
    container_name: student_04_fsb
    ports:
      - "9003:9003"
    restart: unless-stopped
