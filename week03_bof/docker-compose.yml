services:
  # [소프트웨어및시스템보안] 주차별 개별 실습 컨테이너 (02_bof)
  ctf-bof:
    build:
      context: ./02_bof
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      - STUDENT_ID=${STUDENT_ID:-default}
    container_name: student_02_bof
    ports:
      - "9001:9001"
    restart: unless-stopped
