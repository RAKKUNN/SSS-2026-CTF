services:
  # [소프트웨어및시스템보안] 주차별 개별 실습 컨테이너 (03_bof_shellcode)
  ctf-bof-shellcode:
    build:
      context: ./03_bof_shellcode
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      - STUDENT_ID=${STUDENT_ID:-default}
    container_name: student_03_bof_shellcode
    ports:
      - "9002:9002"
    restart: unless-stopped
